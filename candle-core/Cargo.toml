[package]
name = "candle-core"
version = "0.0.174"
edition.workspace = true
description.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
readme = "README.md"

[dependencies]
accelerate-src = { workspace = true, optional = true }
byteorder = { workspace = true }
candle-kernels = { workspace = true, optional = true }
candle-metal-kernels = { workspace = true, optional = true }
candle-wgpu-kernels = { workspace = true, optional = true }
candle-vulkan-kernels = { workspace = true, optional = true }
objc2-metal = { workspace = true, optional = true }
objc2-foundation = { workspace = true, optional = true }
cudarc = { workspace = true, optional = true }
ash = { workspace = true, optional = true }
gpu-allocator = { workspace = true, optional = true }
gemm = { workspace = true }
half = { workspace = true, features = ["zerocopy"] }
float8 = { workspace = true }
intel-mkl-src = { workspace = true, optional = true }
libc = { workspace = true }
libm = { workspace = true }
memmap2 = { workspace = true }
num-traits = { workspace = true }
num_cpus = { workspace = true }
pollster = { workspace = true, optional = true }
futures-channel = { version = "0.3", optional = true }
rand = { workspace = true }
rand_distr = { workspace = true }
rayon = { workspace = true }
rustc-hash = { workspace = true, optional = true }
safetensors = { workspace = true }
smallvec = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
yoke = { workspace = true }
zerocopy = { workspace = true }
zip = { workspace = true }
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokenizers = { workspace = true, features = ["onig"] }
# Native wgpu: Vulkan / DX12 / Metal / GLES + WGSL (workspace features).
wgpu = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Portable WebGPU in the browser — no native GPU backends.
wgpu = { version = "29", default-features = false, features = ["std", "webgpu", "wgsl"], optional = true }

[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "ios")))'.dependencies]
candle-ug = { workspace = true, optional = true }

[dev-dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
criterion = { workspace = true }
proptest = "1.6.0"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[features]
default = []
cuda = ["cudarc", "dep:candle-kernels", "candle-ug?/cuda"]
cudnn = ["cuda", "cudarc/cudnn"]
nccl = ["cuda", "cudarc/nccl"]
mkl = ["dep:intel-mkl-src"]
accelerate = ["dep:accelerate-src"]
metal = [
    "dep:objc2-metal",
    "dep:objc2-foundation",
    "dep:candle-metal-kernels",
    "candle-ug?/metal",
]
metal-debug-labels = ["metal", "candle-metal-kernels/debug-labels"]
wgpu = ["dep:wgpu", "dep:pollster", "dep:candle-wgpu-kernels", "dep:futures-channel"]
vulkan = ["dep:ash", "dep:gpu-allocator", "dep:candle-vulkan-kernels", "dep:rustc-hash"]
ug = ["dep:candle-ug"]

[[bench]]
name = "bench_main"
harness = false

[[example]]
name = "metal_basics"
required-features = ["metal"]

[[example]]
name = "cuda_basics"
required-features = ["cuda"]

[[example]]
name = "backend_parity_microbench"
required-features = ["vulkan"]

[[example]]
name = "fallback_runtime_audit"
required-features = ["vulkan"]

[[example]]
name = "vk_cuda_matmul_diff"
required-features = ["cuda", "vulkan"]

